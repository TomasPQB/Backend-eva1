<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reservas de canchas</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #eef6ff; color: #1d3557; }
        .container { max-width: 1080px; margin: 30px auto; padding: 0 18px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .nav a, .boton { text-decoration: none; background: #1d4e89; color: white; padding: 10px 15px; border-radius: 8px; display: inline-block; border: 0; cursor: pointer; }
        .nav { display: flex; gap: 12px; align-items: center; }
        .nav form { display: inline; }
        .panel { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.08); margin-bottom: 20px; }
        .error { background: #fdecea; color: #8a1c1c; padding: 10px 12px; border-left: 4px solid #d32f2f; border-radius: 6px; }
        .success { background: #eaf7ee; color: #1f5d3a; padding: 10px 12px; border-left: 4px solid #2e7d32; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #dfe8f3; text-align: left; }
        .badge { display: inline-block; padding: 6px 10px; border-radius: 999px; font-size: 0.85rem; font-weight: bold; }
        .aceptada { background: #dff7e8; color: #1b5e20; }
        .rechazada { background: #ffe8e8; color: #b71c1c; }
        .invalido { background: #fff3cd; color: #7a4b00; }
        form { display: grid; gap: 12px; }
        input, button { font: inherit; padding: 10px 12px; }
        .actions { display: flex; gap: 8px; }
        .danger { background: #b3261e; }
        label { font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Sistema de Reserva de Canchas</h1>
            <div class="nav">
                {% if request.user.is_authenticated %}
                    <span>Hola, {{ request.user.username }}</span>
                    <form action="{% url 'logout' %}" method="post">
                        {% csrf_token %}
                        <button class="boton" type="submit">Salir</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}">Ingresar</a>
                {% endif %}
            </div>
        </div>
        {% if messages %}
            {% for message in messages %}
                <div class="{{ message.tags }} panel">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
